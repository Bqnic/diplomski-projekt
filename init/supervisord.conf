# required to supress some logs
[supervisord]
nodaemon=true
user=root

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700
username=admin
password=strongpassword

# needed programs
[program:go_grpc_server]
command=/usr/local/bin/flnode
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:python_grpc_server]
command=python3 /app/model/grpc/grpc-server.py
directory=/app
environment=PYTHONPATH="/app"
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:diabetes_trainer]
command=python3 /app/model/diabetes_train_single.py --epochs 10 --batch-size 1024
directory=/app
environment=PYTHONPATH="/app"
autostart=true
autorestart=false
startsecs=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

