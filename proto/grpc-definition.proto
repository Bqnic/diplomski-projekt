syntax = "proto3";

package model.grpc.autogenerated;

// Go module import path (NOT filesystem path)
// Suffix after ';' = the Go package name
option go_package = "github.com/bqnic/diplomski-projekt/server/grpc/autogenerated;autogenerated";

service ModelService {
  rpc UploadModel(ModelRequest) returns (ModelResponse);
}

message ModelRequest {
  string model_id = 1;
  bytes content = 2;
  int64 size = 3;
  string hash = 4;
}

message ModelResponse {
  bool ok = 1;
  string message = 2;
}
